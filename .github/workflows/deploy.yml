name: Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Terraform setup
        uses: ./.github/actions/terraform-setup
        with:
          role-arn: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          state-bucket: ${{ secrets.TF_STATE_BUCKET }}
          project-name: ${{ vars.PROJECT_NAME }}

      - name: Terraform Apply (EKS cluster and Fargate profiles first)
        run: |
          terraform apply -auto-approve \
            -target=module.vpc \
            -target=module.eks.aws_eks_cluster.main \
            -target=module.eks.aws_eks_node_group.system \
            -target=module.eks.aws_eks_fargate_profile.app 

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name $(terraform output -raw eks_cluster_name) --region us-east-1

      - name: Terraform Apply (everything else)
        id: apply_rest
        continue-on-error: true
        run: terraform apply -auto-approve

      - name: Debug cluster state on failure
        if: steps.apply_rest.outcome == 'failure'
        run: |
          echo "=== All pods ==="
          kubectl get pods -A
          echo "=== CoreDNS pod details ==="
          kubectl describe pods -n kube-system -l k8s-app=kube-dns
          echo "=== LB controller pod details (if any) ==="
          kubectl get pods -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller
          kubectl describe pods -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller || true
          kubectl logs -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller --tail=100 || true

      - name: Fail if apply failed
        if: steps.apply_rest.outcome == 'failure'
        run: exit 1

      - name: Get ECR repository URL
        id: ecr
        run: |
          echo "url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push image
        working-directory: .
        run: |
          docker build -t ${{ steps.ecr.outputs.url }}:${{ github.sha }} .
          docker push ${{ steps.ecr.outputs.url }}:${{ github.sha }}

      - name: Deploy application chart
        working-directory: .
        run: |
          helm upgrade --install account-service ./infra/charts/account-service \
            --namespace default \
            --set image.repository=$(terraform -chdir=infra output -raw ecr_repository_url) \
            --set image.tag=${{ github.sha }} \
            --set serviceAccount.roleArn=$(terraform -chdir=infra output -raw app_pod_role_arn) \
            --set env.dbEndpoint=$(terraform -chdir=infra output -raw cluster_endpoint) \
            --set env.dbName=mydatabase \
            --set env.cacheEndpoint=$(terraform -chdir=infra output -raw endpoint) \
            --set env.cachePort=$(terraform -chdir=infra output -raw port) \
            --set env.dirtyFlagTable=$(terraform -chdir=infra output -raw dirty_flag_table_name) \
            --set env.dbSecretArn=$(terraform -chdir=infra output -raw secret_arn)