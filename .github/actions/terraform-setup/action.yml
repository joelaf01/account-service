name: 'Terraform Setup'
description: 'Configures AWS credentials, sets up Terraform, writes backend config, and runs init'
inputs:
  role-arn:
    required: true
  state-bucket:
    required: true
  project-name:
    required: true
  wrapper:
    required: false
    default: 'false'
  console-admin-arn:
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: us-east-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_wrapper: ${{ inputs.wrapper }}

    - name: Export Terraform variables
      shell: bash
      run: |
        echo "TF_VAR_project_name=${{ inputs.project-name }}" >> "$GITHUB_ENV"
        echo "TF_VAR_aws_region=us-east-1" >> "$GITHUB_ENV"
        echo 'TF_VAR_availability_zones=["us-east-1a", "us-east-1b"]' >> "$GITHUB_ENV"
        echo 'TF_VAR_public_subnet_cidrs=["10.0.1.0/24", "10.0.2.0/24"]' >> "$GITHUB_ENV"
        echo 'TF_VAR_private_subnet_cidrs=["10.0.11.0/24", "10.0.12.0/24"]' >> "$GITHUB_ENV"
        echo "TF_VAR_console_admin_principal_arn=${{ inputs.console-admin-arn }}" >> "$GITHUB_ENV"

    - name: Write backend config
      shell: bash
      working-directory: infra
      run: echo "bucket = \"${{ inputs.state-bucket }}\"" > backend.hcl

    - name: Terraform Init
      shell: bash
      working-directory: infra
      run: terraform init -backend-config=backend.hcl