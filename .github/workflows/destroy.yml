name: Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm you want to tear down all infrastructure'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Verify confirmation
        if: github.event.inputs.confirm != 'destroy'
        run: |
          echo "Confirmation input did not match 'destroy'. Aborting."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Terraform setup
        uses: ./.github/actions/terraform-setup
        with:
          role-arn: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          state-bucket: ${{ secrets.TF_STATE_BUCKET }}
          project-name: ${{ vars.PROJECT_NAME }}

      - name: Update kubeconfig
        run: |
          CLUSTER_NAME=$(terraform output -raw eks_cluster_name 2>/dev/null || echo "")
          if [ -n "$CLUSTER_NAME" ]; then
            aws eks update-kubeconfig --name "$CLUSTER_NAME" --region us-east-1
          else
            echo "No EKS cluster found in state, skipping kubeconfig setup."
          fi

      - name: Uninstall application chart
        working-directory: .
        run: |
          if kubectl cluster-info &>/dev/null; then
            helm uninstall account-service --namespace default --ignore-not-found
            sleep 30
          else
            echo "No reachable cluster, skipping Helm uninstall."
          fi

      - name: Terraform Destroy
        run: terraform destroy -auto-approve