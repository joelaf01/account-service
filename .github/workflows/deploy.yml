name: Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Terraform setup
        uses: ./.github/actions/terraform-setup
        with:
          role-arn: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          state-bucket: ${{ secrets.TF_STATE_BUCKET }}
          project-name: ${{ vars.PROJECT_NAME }}

      - name: Terraform Apply (EKS cluster first)
        run: terraform apply -auto-approve -target=module.eks.aws_eks_cluster.main

      - name: Terraform Apply (everything else)
        run: terraform apply -auto-approve

      - name: Get ECR repository URL
        id: ecr
        run: |
          echo "url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push image
        working-directory: .
        run: |
          docker build -t ${{ steps.ecr.outputs.url }}:${{ github.sha }} .
          docker push ${{ steps.ecr.outputs.url }}:${{ github.sha }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name $(terraform output -raw eks_cluster_name) --region us-east-1

      - name: Deploy application chart
        working-directory: .
        run: |
          helm upgrade --install account-service ./infra/charts/account-service \
            --namespace default \
            --set image.repository=$(terraform -chdir=infra output -raw ecr_repository_url) \
            --set image.tag=${{ github.sha }} \
            --set serviceAccount.roleArn=$(terraform -chdir=infra output -raw app_pod_role_arn) \
            --set env.dbEndpoint=$(terraform -chdir=infra output -raw cluster_endpoint) \
            --set env.dbName=mydatabase \
            --set env.cacheEndpoint=$(terraform -chdir=infra output -raw endpoint) \
            --set env.cachePort=$(terraform -chdir=infra output -raw port) \
            --set env.dirtyFlagTable=$(terraform -chdir=infra output -raw dirty_flag_table_name) \
            --set env.dbSecretArn=$(terraform -chdir=infra output -raw secret_arn)