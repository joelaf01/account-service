name: Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm you want to tear down all infrastructure'

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Verify confirmation
        if: github.event.inputs.confirm != 'destroy'
        run: |
          echo "Confirmation input did not match 'destroy'. Aborting."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: true

      - name: Write backend config
        run: |
          echo "bucket = \"${{ secrets.TF_STATE_BUCKET }}\"" > backend.hcl

      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl

      - name: Terraform Destroy
        run: terraform destroy -auto-approve