name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5.5.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check formatting (Spotless)
        run: ./gradlew spotlessCheck

      - name: Verify Docker
        run: docker info

      - name: Run Tests
        run: ./gradlew test

      - name: Build
        run: ./gradlew build -x test