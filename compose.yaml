services:
  app:
    build: .
    container_name: account_service
    ports:
      - '8080:8080'
      - '8081:8081'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      dynamodb-local:
        condition: service_healthy
      dynamodb-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mydatabase
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      AWS_DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DYNAMODB_DIRTY_FLAG_TABLE: dirty-flag-table
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: 'redis:8.8.0'
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  dynamodb-local:
    image: 'amazon/dynamodb-local:2.6.1'
    command: "-jar DynamoDBLocal.jar -inMemory -sharedDb"
    ports:
      - '8000:8000'
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
  dynamodb-init:
    image: 'amazon/aws-cli:2.35.24'
    depends_on:
      dynamodb-local:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["sh", "-c"]
    command:
      - |
        aws dynamodb create-table \
          --endpoint-url http://dynamodb-local:8000 \
          --table-name dirty-flag-table \
          --attribute-definitions AttributeName=accountId,AttributeType=S \
          --key-schema AttributeName=accountId,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST || true
        
        aws dynamodb update-time-to-live \
          --endpoint-url http://dynamodb-local:8000 \
          --table-name dirty-flag-table \
          --time-to-live-specification "Enabled=true,AttributeName=ttl"